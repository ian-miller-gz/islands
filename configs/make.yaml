statics:
  - selector: SR_CARTRIDGE
    bundle: {group: engine, directive: SR_CARTRIDGE_BUNDLE}
    options:
      cartridges/.core/launcher: SR_LAUNCHER

flags:
  - selector: SR_PROFILE
    options:
      SR_DEBUG: []
      SR_RELEASE: ["-O2", "-DNDEBUG"]

variants:
  - selector: SR_PLATFORM
    options:
      conduit/segment/posix: SR_POSIX
      conduit/segment/windows: SR_WINDOWS
      test/conduit/wire/posix: SR_POSIX
      test/conduit/wire/windows: SR_WINDOWS
      shell/os/spawn/posix: SR_POSIX
      shell/os/spawn/windows: SR_WINDOWS
      reef/halt/posix: SR_POSIX
      reef/halt/windows: SR_WINDOWS
      cartridge/relations.spawn.posix.cpp: SR_POSIX
      cartridge/relations.spawn.web.cpp: SR_WEB
      cartridge/relations.spawn.windows.cpp: SR_WINDOWS
      cartridge/relations.spawn.windows.launch.cpp: SR_WINDOWS
      cartridge/load/posix: SR_POSIX
      cartridge/load/windows: SR_WINDOWS
      common/platform/posix: [SR_POSIX, SR_WEB]
      common/platform/windows: SR_WINDOWS
      metrics/registry/memory.posix.cpp: [SR_POSIX, SR_WEB]
      metrics/registry/memory.windows.cpp: SR_WINDOWS
      island/terminal/backend/repl/posix: SR_POSIX
      island/terminal/backend/repl/windows: SR_WINDOWS
      island/window/backend/glfw/window.chrome.posix.cpp: SR_POSIX
      island/window/backend/glfw/window.chrome.windows.cpp: SR_WINDOWS
      network/backend/posix/wait/posix: SR_POSIX
      network/backend/posix/wait/windows: SR_WINDOWS
      network/web/backend/native/trust/posix: SR_POSIX
      network/web/backend/native/trust/windows: SR_WINDOWS
  - selector: SR_LINKAGE
    options:
      reef/load.static.cpp: SR_STATIC
      src/test/relations/load.static.cpp: SR_STATIC
  - selector: SR_GFX_BACKEND
    options:
      island/graphics/backend/vulkan: SR_VULKAN
  - selector: SR_WINDOW_BACKEND
    options:
      /glfw: SR_GLFW
      glfw3: SR_GLFW
  - selector: SR_OVERLAY_BACKEND
    options:
      island/overlay/backend/none: SR_NONE
  - selector: SR_GUI_BACKEND
    options:
      island/gui/backend/native: SR_NATIVE
  - selector: SR_SAC
    options:
      island/gui/sac: SR_NATIVE
  - selector: SR_LISTEN
    options:
      island/terminal/backend/unix: SR_UNIX
      network/instances/unix: SR_UNIX
  - selector: SR_LOGGER_BACKEND
    options:
      logger/backend/spdlog: SR_SPDLOG
  - selector: SR_DATAGRAM_BACKEND
    options:
      network/backend/posix/udp: SR_UDP
      test/datagram: SR_UDP
  - selector: SR_NETWORK_BACKEND
    options:
      network/backend/posix/unix: SR_UNIX
      network/backend/posix/abstract: SR_ABSTRACT
      network/backend/posix/inet: [SR_TCP, SR_TCP6, SR_SCTP]
      network/backend/posix/vsock: SR_VSOCK
      network/backend/posix/tls: SR_TLS
      network/backend/posix/sessions.peer.cpp: [SR_UNIX, SR_ABSTRACT]
      network/backend/posix: [SR_UNIX, SR_ABSTRACT, SR_TCP, SR_TCP6, SR_SCTP, SR_VSOCK, SR_TLS]
  - selector: SR_TOPICS
    options:
      topics/local: SR_LOCAL
      topics/durable: SR_LOCAL
  - selector: SR_METRICS
    options:
      metrics/registry: SR_REGISTRY
  - selector: SR_MIDI_BACKEND
    options:
      island/midi/backend/alsa: SR_ALSA
      island/midi/backend/none: SR_NONE
  - selector: SR_WEB_BACKEND
    options:
      network/web/backend/native: SR_NATIVE
  - selector: SR_SERVER
    options:
      network/web/server/: SR_NATIVE
  - selector: SR_PLATFORM
    options:
      island/island.cpp: [SR_POSIX, SR_WINDOWS]
      island/web.cpp: SR_WEB
      island/terminal/backend/repl.cpp: [SR_POSIX, SR_WINDOWS]
      cartridges/.test/meadow/tally.cpp: [SR_POSIX, SR_WINDOWS]
      cartridges/.test/meadow/tally.web.cpp: SR_WEB
      conduit: [SR_POSIX, SR_WINDOWS]
      shell/os/spawn: [SR_POSIX, SR_WINDOWS]
      test/streams: [SR_POSIX, SR_WINDOWS]
      test/pty: SR_POSIX
      hosts/.test/jetty: [SR_POSIX, SR_WEB]
      test/store: [SR_POSIX, SR_WINDOWS]
      test/durable: [SR_POSIX, SR_WINDOWS]
      test/relations: [SR_POSIX, SR_WINDOWS]
      reef: [SR_POSIX, SR_WINDOWS]
      cartridges/.core/launcher/monitor: [SR_POSIX, SR_WEB]
